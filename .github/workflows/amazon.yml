name: Refresh Amazon product data

# Amazon allows a stored image link to be kept for at most 24 hours,
# so this runs twice a day and the site ignores data older than 24 hours.
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amazon-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch images and links from Amazon
        env:
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_CREDENTIAL_VERSION: '3.1'
          AMAZON_PARTNER_TAG: boomi1956-20
          AMAZON_MARKETPLACE: www.amazon.com
        run: python3 scripts/fetch_amazon.py

      - name: Save the refreshed data
        run: |
          if git diff --quiet -- data/amazon.json && git ls-files --error-unmatch data/amazon.json >/dev/null 2>&1; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amazon.json
          git commit -m "Refresh Amazon product data"
          git push
